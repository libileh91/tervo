server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Check the built entry point, not a synthetic successful response.
    location = /health {
        try_files /index.html =503;
        access_log off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
