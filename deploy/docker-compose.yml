# Tervo — Docker Compose (production).
#
# Orchestre le backend (FastAPI + uvicorn) et le frontend (Nginx static).
# Le reverse proxy est géré par 1Panel — pas de Traefik.
# Se connecte au réseau PostgreSQL existant (postgres_postgres_network).
#
# Usage:
#   docker compose -f deploy/docker-compose.yml up -d
#   docker compose -f deploy/docker-compose.yml down

name: tervo

services:
  # ── Backend API ──────────────────────────────────────
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - uploads_data:/app/uploads
    environment:
      - DATABASE_URL=postgresql://${TERVO_DB_USER:-lob}:${TERVO_DB_PASSWORD:-password}@postgres:5432/${TERVO_DB_NAME:-tervo_db}
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production}
      - APP_NAME=Tervo
      - API_V1_PREFIX=/api/v1
      - UPLOAD_DIR=/app/uploads
    networks:
      - postgres_network
      - 1panel-network # Ajouter le reseau 1Panel
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/openapi.json')",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  # ── Frontend static ──────────────────────────────────
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    networks:
      - postgres_network
      - 1panel-network # Ajouté le reseaux 1Panel
    restart: unless-stopped

volumes:
  uploads_data:

networks:
  postgres_network:
    external: true
    name: postgres_postgres_network
  1panel-network:
    external: true
    name: 1panel-network
