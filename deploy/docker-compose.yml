# Tervo — production stack, Caddy host proxy (INT-131).
# Always use: docker compose --env-file deploy/.env -f deploy/docker-compose.yml ...
# Validate with config --quiet; do not print resolved secrets.
# Migration/bootstrap/release are separate operations (INT-126 to INT-130).
name: tervo

x-logging: &bounded-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:17.11@sha256:2d2b8998d31037bf721cfdf764d76ba74171b4fab3431b7f72c27c56ddbdf9e3
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${TERVO_DB_NAME:?Set TERVO_DB_NAME in the explicit env file}
      # Administrative superuser, never used by the running API.
      POSTGRES_USER: ${TERVO_DB_ADMIN_USER:?Set TERVO_DB_ADMIN_USER}
      POSTGRES_PASSWORD: ${TERVO_DB_ADMIN_PASSWORD:?Set TERVO_DB_ADMIN_PASSWORD}
      TERVO_DB_USER: ${TERVO_DB_USER:?Set TERVO_DB_USER}
      TERVO_DB_PASSWORD: ${TERVO_DB_PASSWORD:?Set TERVO_DB_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data/pgdata
      - type: bind
        source: ./postgres/init-app.sql
        target: /docker-entrypoint-initdb.d/10-app.sql
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./postgres/app-grants.sql
        target: /opt/tervo/app-grants.sql
        read_only: true
        bind:
          create_host_path: false
    networks:
      - database
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 20s
    logging: *bounded-logging

  backend:
    image: tervo-backend:${TERVO_IMAGE_TAG:?Set TERVO_IMAGE_TAG to the source revision}
    build:
      context: ../backend
      dockerfile: Dockerfile
      # Linux build downloads only; runtime remains on the private bridge.
      network: host
      args:
        VCS_REF: ${TERVO_VCS_REF:?Set TERVO_VCS_REF to the full source SHA}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    environment: &backend-environment
      APP_ENV: production
      TERVO_DB_HOST: postgres
      TERVO_DB_PORT: "5432"
      TERVO_DB_NAME: ${TERVO_DB_NAME:?Set TERVO_DB_NAME}
      TERVO_DB_USER: ${TERVO_DB_USER:?Set TERVO_DB_USER}
      TERVO_DB_PASSWORD: ${TERVO_DB_PASSWORD:?Set TERVO_DB_PASSWORD}
      SECRET_KEY: ${SECRET_KEY:?Set a strong SECRET_KEY}
      CORS_ORIGINS: '["${FRONTEND_ORIGIN:?Set the HTTPS frontend origin}"]'
      UPLOAD_DIR: /app/uploads
      UPLOAD_URL: /uploads
    volumes:
      - uploads_data:/app/uploads
    networks:
      - database
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging: *bounded-logging

  migrate:
    # Explicit one-shot command, not part of a normal `up`.
    profiles: ["tools"]
    image: tervo-backend:${TERVO_IMAGE_TAG:?Set TERVO_IMAGE_TAG}
    command: ["alembic", "upgrade", "head"]
    environment:
      <<: *backend-environment
      TERVO_DB_USER: ${TERVO_DB_ADMIN_USER:?Set TERVO_DB_ADMIN_USER}
      TERVO_DB_PASSWORD: ${TERVO_DB_ADMIN_PASSWORD:?Set TERVO_DB_ADMIN_PASSWORD}
    networks:
      - database
    healthcheck:
      disable: true
    logging: *bounded-logging

  frontend:
    image: tervo-frontend:${TERVO_IMAGE_TAG:?Set TERVO_IMAGE_TAG to the source revision}
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        VCS_REF: ${TERVO_VCS_REF:?Set TERVO_VCS_REF to the full source SHA}
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:?Set the HTTPS API base URL}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    networks:
      - frontend
    logging: *bounded-logging

volumes:
  postgres_data:
  uploads_data:

networks:
  database:
    driver: bridge
  frontend:
    driver: bridge
