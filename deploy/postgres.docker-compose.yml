# Tervo — PostgreSQL autonome (option "PG partagé").
#
# Ce fichier lance PostgreSQL SEUL, sur son propre réseau.
#
# Cas d'usage : plusieurs applications partagent la même instance PostgreSQL.
# Pour la stack Tervo complète (recommandé), utiliser `docker-compose.yml`
# qui embarque déjà PostgreSQL avec les healthchecks et dépendances.
#
# Démarrage :
#   docker compose -f deploy/postgres.docker-compose.yml up -d

services:
  postgres:
    image: postgres:17.4
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      POSTGRES_USER: ${POSTGRES_USER:-lob}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      PGDATA: /var/lib/postgresql/data/pgdata
    # Aucun port publié sur l'hôte : PostgreSQL n'est accessible que dans
    # le réseau Docker `postgres_network`, via le nom de service `postgres`.
    #
    # Pour un accès administrateur ponctuel depuis l'hôte :
    #   docker exec -it postgres psql -U lob -d tervo_db
    #
    # (Ne jamais publier 5432 sur 0.0.0.0 — la base serait exposée à Internet.)
    volumes:
      - postgres_data:/var/lib/postgresql/data/pgdata
      - ./init:/docker-entrypoint-initdb.d
      - ./backups:/backups
    networks:
      - postgres_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lob} -d ${POSTGRES_DB:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    command: |
      postgres
      -c shared_preload_libraries=pg_stat_statements
      -c max_connections=200
      -c shared_buffers=256MB
      -c effective_cache_size=1GB
      -c maintenance_work_mem=64MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c default_statistics_target=100
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c work_mem=4MB
      -c min_wal_size=1GB
      -c max_wal_size=4GB
      -c log_statement=mod
      -c log_min_duration_statement=1000

volumes:
  postgres_data:
    driver: local

networks:
  postgres_network:
    driver: bridge
    external: false
