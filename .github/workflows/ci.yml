# Tervo — Intégration et déploiement continus
#
# Principe : UN SEUL BUILD.
#   - GitHub Actions : vérifie (tests backend + build frontend)
#   - Le VPS : construit et démarre les images
#
# Pourquoi ne pas builder dans GitHub Actions ET sur le VPS ?
#   Les images construites dans la CI ne seraient pas réutilisées (aucun
#   registry intermédiaire) : le build serait fait deux fois pour rien.
#   Voir docs/DAT/annexes/revue-architecture.md §5.
#
# Évolution possible (non implémentée) :
#   CI → build → push GHCR → VPS → docker compose pull → up -d
#
# ⚠️ Le déploiement est désactivé par défaut.
#   Il s'active en définissant la variable de dépôt DEPLOY_ENABLED = 'true'
#   (Settings → Secrets and variables → Actions → Variables).
#   À activer quand le VPS est provisionné et les secrets en place (Stage 6.4).

name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Backend : tests ─────────────────────────────────────
  backend-tests:
    name: Backend — tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v7

      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run tests
        run: uv run pytest tests/ -q

  # ── Frontend : build ────────────────────────────────────
  frontend-build:
    name: Frontend — build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

  # ── Déploiement ─────────────────────────────────────────
  # Uniquement sur un push vers main, si les vérifications ont réussi
  # ET si le déploiement a été explicitement activé (variable de dépôt).
  deploy:
    name: Deploy — VPS
    needs: [backend-tests, frontend-build]
    if: >
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push' &&
      vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /opt/tervo
            git pull --ff-only
            docker compose -f deploy/docker-compose.yml up -d --build
            docker exec tervo-backend-1 alembic upgrade head
            docker image prune -f
