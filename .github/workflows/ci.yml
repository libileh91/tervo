# Tervo — Intégration et déploiement continus
#
# Principe : UN SEUL BUILD.
#   - GitHub Actions : vérifie (tests backend + build frontend)
#   - Le VPS : construit et démarre les images
#
# Pourquoi ne pas builder dans GitHub Actions ET sur le VPS ?
#   Les images construites dans la CI ne seraient pas réutilisées (aucun
#   registry intermédiaire) : le build serait fait deux fois pour rien.
#
# Évolution possible (non implémentée) :
#   CI → build → push GHCR → VPS → docker compose pull → up -d
#
# ⚠️ Le déploiement est désactivé par défaut.
#   Il s'active en définissant la variable de dépôt DEPLOY_ENABLED = 'true'
#   (Settings → Secrets and variables → Actions → Variables).
#   À activer quand le VPS est provisionné et les secrets en place.
#
# Optimisations (20/09/2026) :
#   1. paths-ignore  — un changement purement documentaire (docs/, notes/,
#                      *.md) ne déclenche pas le pipeline : rien à tester.
#   2. concurrency   — un nouveau push annule le run obsolète d'une même
#                      branche. Sur main, le run en cours n'est PAS annulé
#                      (un déploiement ne doit pas être coupé à mi-chemin) :
#                      les pushes suivants sont mis en file d'attente.
#
# ⚠️ Si une protection de branche exige ces checks, un run sauté (paths-ignore)
#    peut laisser le check en attente et bloquer le merge. Ce n'est pas le cas
#    ici (push direct sur main), mais c'est à garder en tête si on ajoute des
#    règles de protection plus tard.

name: CI/CD

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "notes/**"
      - "**/*.md"
      - ".gitignore"
  pull_request:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "notes/**"
      - "**/*.md"
      - ".gitignore"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # ── Backend : tests ─────────────────────────────────────
  backend-tests:
    name: Backend — tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:17.4
        env:
          POSTGRES_USER: tervo_ci
          POSTGRES_PASSWORD: local-ci-only
          POSTGRES_DB: tervo_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tervo_ci -d tervo_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run tests
        run: uv run pytest tests/ -q

      - name: PostgreSQL migrations round trip
        env:
          DATABASE_URL: postgresql+psycopg2://tervo_ci:local-ci-only@127.0.0.1:5432/tervo_ci
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade -1
          uv run alembic upgrade head

      - name: PostgreSQL installation and sales APIs, transactions and migrations
        env:
          TERVO_INSTALLATION_TEST_DATABASE_URL: postgresql+asyncpg://tervo_ci:local-ci-only@127.0.0.1:5432/tervo_ci
          TERVO_SALE_TEST_DATABASE_URL: postgresql+asyncpg://tervo_ci:local-ci-only@127.0.0.1:5432/tervo_ci
          TERVO_INSTALLATION_MIGRATION_TEST_URL: postgresql+psycopg2://tervo_ci:local-ci-only@127.0.0.1:5432/tervo_ci
        run: uv run pytest tests/test_installations.py tests/test_sales.py tests/test_installation_migration.py -q

      - name: PostgreSQL import service and admin API
        env:
          TERVO_IMPORT_TEST_DATABASE_URL: postgresql+asyncpg://tervo_ci:local-ci-only@127.0.0.1:5432/tervo_ci
        run: uv run pytest tests/test_import_service_v2.py tests/test_import_api_v2.py -q

      - name: PostgreSQL checklist snapshots and historical migration
        env:
          TERVO_CHECKLIST_TEST_DATABASE_URL: postgresql+asyncpg://tervo_ci:local-ci-only@127.0.0.1:5432/tervo_ci
          TERVO_CHECKLIST_MIGRATION_TEST_URL: postgresql+psycopg2://tervo_ci:local-ci-only@127.0.0.1:5432/tervo_ci
        run: uv run pytest tests/test_int104_checklists.py tests/test_checklist_migration.py -q

      - name: PostgreSQL media usages and historical migration
        env:
          TERVO_MEDIA_TEST_DATABASE_URL: postgresql+asyncpg://tervo_ci:local-ci-only@127.0.0.1:5432/tervo_ci
          TERVO_MEDIA_MIGRATION_TEST_URL: postgresql+psycopg2://tervo_ci:local-ci-only@127.0.0.1:5432/tervo_ci
        run: uv run pytest tests/test_int105_media.py tests/test_media_migration.py -q

      - name: PostgreSQL intervention outcomes and atomic completion
        env:
          TERVO_RESULT_TEST_DATABASE_URL: postgresql+asyncpg://tervo_ci:local-ci-only@127.0.0.1:5432/tervo_ci
          TERVO_RESULT_MIGRATION_TEST_URL: postgresql+psycopg2://tervo_ci:local-ci-only@127.0.0.1:5432/tervo_ci
        run: uv run pytest tests/test_int106_completion.py tests/test_intervention_result_migration.py -q

      - name: PostgreSQL private report version scenario
        env:
          TERVO_REPORT_TEST_DATABASE_URL: postgresql+asyncpg://tervo_ci:local-ci-only@127.0.0.1:5432/tervo_ci
        run: uv run pytest tests/test_report_versions_api.py -q

      - name: PostgreSQL showroom prospect scenario
        env:
          TERVO_SHOWROOM_TEST_DATABASE_URL: postgresql+asyncpg://tervo_ci:local-ci-only@127.0.0.1:5432/tervo_ci
        run: uv run pytest tests/test_showroom_api.py -q

  # ── Frontend : build ────────────────────────────────────
  frontend-build:
    name: Frontend — build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Checklist draft tests
        run: bun test tests

      - name: Typecheck
        run: bun run typecheck

      - name: Build
        run: bun run build

  # ── Déploiement ─────────────────────────────────────────
  # Uniquement sur un push vers main, si les vérifications ont réussi
  # ET si le déploiement a été explicitement activé (variable de dépôt).
  deploy:
    name: Deploy — VPS
    needs: [backend-tests, frontend-build]
    if: >
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push' &&
      vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /opt/tervo
            git pull --ff-only
            docker compose -f deploy/docker-compose.yml up -d --build
            docker exec tervo-backend-1 alembic upgrade head
            docker image prune -f
